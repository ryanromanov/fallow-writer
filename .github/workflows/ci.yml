name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # The sound tests render offline and never touch audio hardware; the animation and
      # sound panel tests open real windows, which the runner's desktop session allows.
      - name: Test
        run: scripts/test.sh

      - name: Bundle the app
        run: scripts/bundle.sh

      # Each run's app can be downloaded from the run page to try a change.
      # It's ad-hoc signed: right-click it and choose Open the first time.
      - name: Zip the app
        run: ditto -c -k --keepParent Fallow.app Fallow.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Fallow-${{ github.sha }}
          path: Fallow.zip
          retention-days: 14

  ios:
    name: iPhone and iPad
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The newest Xcode on the runner that isn't a beta, which may be newer than the default.
      - name: Choose Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version

      - name: Test
        run: scripts/test-ios.sh

      # A device build, unsigned, checks the app itself compiles for iPhone and iPad.
      - name: Build the app
        run: |
          xcodebuild build -project iOS/Fallow.xcodeproj -scheme "Fallow iOS" \
            -destination 'generic/platform=iOS' -derivedDataPath .build/ios \
            CODE_SIGNING_ALLOWED=NO | grep -E 'error:|\*\* BUILD'
          test "${PIPESTATUS[0]}" -eq 0
